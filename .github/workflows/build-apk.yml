name: Build mobile remote APK

on:
  push:
    paths:
      - "src/mobile-remote/**"
      - "src/shared/search.js"
      - "mobile-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest already ships an Android SDK (that's what android-actions/setup-android
      # itself drives) - it just needs the platform/build-tools this project targets. Not
      # using that action: it tries to install the long-discontinued legacy "tools"
      # package and fails outright, even though everything else about it works fine.
      - name: Install the required Android SDK platform/build-tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # spessasynth_lib/spessasynth_core and the app icon get vendored into
      # src/mobile-remote/ from here, the same way a local `npm start` does.
      - name: Install root dependencies and vendor mobile assets
        run: |
          npm ci
          node scripts/copy-mobile-vendor.cjs

      - name: Install Capacitor dependencies and sync the Android project
        working-directory: mobile-app
        run: |
          npm ci
          npx cap sync android

      - name: Build the debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: zee-ing-bee-remote-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk

      # The desktop installers land on this version's GitHub release (see installers.yml);
      # attach the APK there too, once that release exists, instead of leaving it only as
      # a workflow artifact (private to signed-in repo collaborators, and pruned after 30
      # days). A push that only touches the mobile app, with no matching release yet, just
      # keeps the artifact above - there's nothing to attach it to yet.
      - name: Attach the APK to this version's release, if one exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk "Zee-ing-Bee-Remote-$TAG.apk"
            gh release upload "$TAG" "Zee-ing-Bee-Remote-$TAG.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "No release for $TAG yet - the .apk stays as a workflow artifact until one exists."
          fi
