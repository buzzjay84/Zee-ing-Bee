name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            target: win
            arch: x64
          - platform: macOS
            runner: macos-15
            target: mac
            arch: arm64
          - platform: macOS
            runner: macos-15-intel
            target: mac
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Test
        run: |
          npm run make-demo-songs
          npm test
      - name: Download basic sound bank and license
        run: npm run fetch-soundfont
      - name: Prepare installer configuration
        run: node scripts/prepare-ci-build.cjs
      - name: Build installer
        # Mac dmg and zip are built as separate invocations: building them together races
        # dmgbuild's disk-image eject against the zip step still reading the same staged
        # app, which intermittently fails with "Resource busy" on the GitHub runners.
        run: |
          if [ "${{ matrix.target }}" = "mac" ]; then
            npx electron-builder --config dist/electron-builder-ci.json --mac dmg --${{ matrix.arch }} --publish never
            npx electron-builder --config dist/electron-builder-ci.json --mac zip --${{ matrix.arch }} --publish never
          else
            npx electron-builder --config dist/electron-builder-ci.json --${{ matrix.target }} --${{ matrix.arch }} --publish never
          fi
      - name: Generate checksums
        run: node scripts/installer-checksums.cjs ${{ matrix.target }} ${{ matrix.arch }}
      - name: Save installers
        uses: actions/upload-artifact@v4
        with:
          name: zee-ing-bee-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            !dist/builder-debug.yml
            dist/*.blockmap
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tagged installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: zee-ing-bee-*
          path: installers
          merge-multiple: true
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" installers/* --clobber
            gh release edit "$RELEASE_TAG" --title "Zee-ing Bee $RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft=false
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Zee-ing Bee $RELEASE_TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" installers/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          fi
