name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64 --x64
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run fetch-soundfont
      - run: npm run make-demo-songs
      - run: npm test
      - name: Allow source-only builds without private assets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const section of ['win', 'mac', 'nsis']) {
            for (const key of ['icon', 'installerIcon', 'uninstallerIcon']) {
              const file = config.build[section]?.[key];
              if (file && !fs.existsSync(file)) delete config.build[section][key];
            }
          }
          config.build.extraResources = config.build.extraResources.filter(entry => fs.existsSync(entry.from));
          fs.writeFileSync('package.json', JSON.stringify(config, null, 2));
          NODE
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No Apple Developer ID yet: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: zeenging-bee-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
